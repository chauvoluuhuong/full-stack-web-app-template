services:
  app:
    build:
      context: ../
      dockerfile: ./deployment/DevDockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - mongodb://admin:password@mongodb:27017/nestjs-app?authSource=admin
    depends_on:
      - mongodb
    volumes:
      - ..:/app
      - /app/node_modules

    networks:
      - app-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=nestjs-app
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
